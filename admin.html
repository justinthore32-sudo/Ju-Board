<!DOCTYPE html>
<html lang="fr">
<head>
<script>
if (!localStorage.getItem('ju-board-token')) { location.href = 'login.html'; }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion des comptes — Ju Board</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#1A1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ju Board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/main.css?v=20260828b">
<link rel="stylesheet" href="css/components.css?v=20260828b">
<link rel="stylesheet" href="css/pages.css?v=20260828b">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">Ju Board</a>
  <div class="header-actions">
    <button class="theme-switch" id="theme-switch" aria-label="Changer de thème">
      <span id="theme-icon">🌙</span>
    </button>
    <div class="user-menu-wrap">
      <button class="theme-switch" id="user-menu-btn" aria-label="Menu utilisateur"><span id="user-initial">?</span></button>
      <div class="search-results user-menu" id="user-menu">
        <div class="search-group">
          <div class="search-group-title" id="user-menu-name">—</div>
          <a href="admin.html" class="search-result hidden" id="user-menu-admin">⚙️ Gestion des comptes</a>
          <button class="search-result user-menu-logout-btn" id="user-menu-logout">↪ Se déconnecter</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <a href="index.html" style="display:inline-block; margin-top:20px; font-size:13px; color:var(--accent);">← Retour à l'accueil</a>

  <h1 class="section-title" style="font-family: var(--font-serif); font-size: 28px; margin-top: 12px;">Gestion des comptes</h1>
  <p style="font-size: 13px; color: var(--text3); margin-top: -6px;">Réservé à l'administrateur.</p>

  <section class="section">
    <h2 class="section-title" style="font-size: 16px;">Comptes existants</h2>
    <div id="users-list" class="earnings-list">
      <div class="card skeleton" style="height: 56px;"></div>
    </div>
  </section>

  <section class="section" style="margin-bottom: 32px;">
    <h2 class="section-title" style="font-size: 16px;">Créer un compte</h2>
    <form id="create-user-form" class="card" style="display:flex; flex-direction:column; gap:14px;">
      <label class="login-field">
        <span>Nom d'utilisateur</span>
        <input type="text" id="new-username" required>
      </label>
      <label class="login-field">
        <span>Nom affiché (pour le "Bonjour ...")</span>
        <input type="text" id="new-displayname" required>
      </label>
      <label class="login-field">
        <span>Mot de passe</span>
        <input type="password" id="new-password" required>
      </label>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text2);">
        <input type="checkbox" id="new-isadmin">
        Ce compte est administrateur
      </label>
      <p class="login-error hidden" id="create-user-error"></p>
      <button type="submit" class="btn login-submit">Créer le compte</button>
    </form>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="js/api.js?v=20260828b"></script>
<script src="js/auth.js?v=20260828b"></script>
<script src="js/utils.js?v=20260828b"></script>
<script src="js/admin.js?v=20260828b"></script>
</body>
</html>
