<body>

<header class="header">
  <a href="index.html" class="logo">Ju Board</a>
  <div class="header-actions">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <a href="calendrier.html" class="theme-switch" aria-label="Calendrier des résultats" style="position:relative;">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      <span class="calendar-badge hidden" id="calendar-badge">?</span>
    </a>
    <button class="theme-switch" id="theme-switch" aria-label="Changer de thème">
      <span id="theme-icon">🌙</span>
    </button>
    <div class="user-menu-wrap">
      <button class="theme-switch" id="user-menu-btn" aria-label="Menu utilisateur"><span id="user-initial">?</span></button>
      <div class="search-results user-menu" id="user-menu">
        <div class="search-group">
          <div class="search-group-title" id="user-menu-name">—</div>
          <a href="admin.html" class="search-result hidden" id="user-menu-admin">⚙️ Gestion des comptes</a>
          <button class="search-result user-menu-logout-btn" id="user-menu-logout">↪ Se déconnecter</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <h1 class="section-title" style="font-family: var(--font-serif); font-size: 28px; margin-top: 20px;">Calendrier des résultats</h1>
  <p style="font-size: 13px; color: var(--text3); margin-top: -6px;">Les géants tech sont toujours affichés, avec ou sans date proche.</p>

  <div class="sort-tabs" style="margin-top:16px;">
    <button class="sort-tab active" data-tab="upcoming">À venir</button>
    <button class="sort-tab" data-tab="latest">Précédent</button>
  </div>

  <section class="section" id="tab-upcoming">
    <h2 class="section-title" style="font-size:15px;">🏆 Géants Tech</h2>
    <div class="table-wrap"><table class="cal-table" id="table-tech-upcoming"></table></div>

    <h2 class="section-title" style="font-size:15px; margin-top:22px;">Autres entreprises</h2>
    <div class="table-wrap"><table class="cal-table" id="table-other-upcoming"></table></div>
  </section>

  <section class="section hidden" id="tab-latest" style="margin-bottom:32px;">
    <h2 class="section-title" style="font-size:15px;">🏆 Géants Tech</h2>
    <div class="table-wrap"><table class="cal-table" id="table-tech-latest"></table></div>

    <h2 class="section-title" style="font-size:15px; margin-top:22px;">Autres entreprises</h2>
    <div class="table-wrap"><table class="cal-table" id="table-other-latest"></table></div>
  </section>
