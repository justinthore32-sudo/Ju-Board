<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ju Board — Comprendre ce qui se passe dans le monde</title>
<meta name="description" content="Ju Board — tableau de bord informationnel mondial premium.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#1A1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ju Board">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <a href="index.html" class="logo">Ju Board</a>
  <div class="header-actions">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <button class="theme-switch" id="theme-switch" aria-label="Changer de thème">
      <span id="theme-icon">🌙</span>
    </button>
  </div>
</header>

<main class="container">

  <!-- ===== GREETING ===== -->
  <div class="greeting">
    <div>
      <h1 class="greeting-name">Bonjour Justin</h1>
      <p class="greeting-date" id="greeting-date">Vendredi 26 août 2026</p>
    </div>
    <div class="weather-widget">
      <span class="weather-icon" id="weather-icon">☀️</span>
      <span class="weather-temp" id="weather-temp">24°C</span>
    </div>
  </div>

  <!-- ===== PRIORITÉ ABSOLUE ===== -->
  <section class="section">
    <div class="priority-box">
      <div class="section-header">
        <span class="priority-badge">Priorité absolue</span>
      </div>

      <div id="priority-list">
        <div class="skeleton" style="height: 90px; margin-bottom: 12px;"></div>
        <div class="skeleton" style="height: 90px;"></div>
      </div>
    </div>
  </section>

  <!-- ===== À NE PAS MANQUER ===== -->
  <section class="section">
    <div class="highlight-box">
      <span class="highlight-title">✨ À ne pas manquer</span>

      <div id="highlight-list">
        <div class="skeleton" style="height: 90px; margin-bottom: 12px;"></div>
        <div class="skeleton" style="height: 90px;"></div>
      </div>
    </div>
  </section>

  <!-- ===== SECTEURS ===== -->
  <section class="section" style="margin-bottom: 24px;">
    <h2 class="section-title">Secteurs</h2>
    <div class="sectors-grid" id="sectors-grid">
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
      <div class="card sector-card skeleton" style="height: 90px;"></div>
    </div>
  </section>

</main>
